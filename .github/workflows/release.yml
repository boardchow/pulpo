name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - run: cargo test --locked
      - name: Build for Apple silicon and Intel
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output pulpo-macos target/aarch64-apple-darwin/release/pulpo target/x86_64-apple-darwin/release/pulpo
          codesign --force --sign - pulpo-macos
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves the tag without its message, which holds the notes.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" pulpo-macos --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
